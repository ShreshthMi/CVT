# =====================================================
# Control table "Reset Type" -> CFG_SECTION.RESET_OUT   (Phase 2 / VTF-362 UAT)
#
# RESET_OUT is NOT a CQ-IR key: fcvt-phase2-design.md 361 and pdq-upload-contract-v1.4.wiki 130
# both state it is "derived from the control table at validate time" and that its CQ-IR row is a
# meta row. This file is that derivation's lookup table -- the enumeration carried as open item A3
# in fcvt-phase2-design.md 578, pdq-sample-data-gaps.md 51 and input-artefacts-pdq-workbook.wiki 340,
# supplied by AE on 2026-08-24.
#
# The catalog matches the finalised Ver14 / R14.1 template's drop-down ('DD List'!J99:J101). AE may
# extend it without a rebuild -- same stance as pdq-mappings.properties.
#
# Keys are the Reset Type text NORMALISED: trimmed, upper-cased, internal whitespace runs collapsed
# to a single underscore. The sheet value is passed through verbatim by the parser
# (input-artefacts-pdq-workbook.wiki 190), so normalising absorbs the casing and spacing drift that
# free text picks up. Values are the raw ADC RESET_OUT code; its display label comes from
# value-mappings.properties (RESET_OUT.0..13) as for every other DP Details column.
#
# Kept OUT of pdq-mappings.properties on purpose: that file's header scopes it to the CQ-IR parser's
# numeric transforms, and this table is consumed at validate time by the preprocessor instead.
# =====================================================

