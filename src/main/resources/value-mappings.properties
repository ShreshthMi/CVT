# Communication Failure Mappings
COMM_FAIL.0=0 - normal
COMM_FAIL.1=1 - fault

# Behavior General Mappings
BEHAV_GE.0=0 - Restriction at fault, no restriction at power-up  
BEHAV_GE.1=1 - No reset restriction
BEHAV_GE.2=2 - Reset restriction


# Clear Track Mappings
CLR_TRACK.0=0 - Clearing of track with at least 2 counting heads
CLR_TRACK.1=1 - Clearing of track with at 1 counting heads
CLR_TRACK.2=2 - Clearing of track at all counting heads
CLR_TRACK.3=3 - Clearing of track at first 2 counting heads

# Reset In Mappings
RESET_IN.0=0 - not allowed
RESET_IN.1=1 - reset
RESET_IN.2=2 - (reset + clearing of track)
RESET_IN.3=3 - pre-reset
RESET_IN.4=4 - (pre-reset + clearing of track)
RESET_IN.5=5 - (pre-reset + reset)
RESET_IN.6=6 - (pre-reset + reset + clearing of track)
RESET_IN.7=7 - reset or pre-reset
RESET_IN.8=8 - reset or (pre-reset + clearing of track)
RESET_IN.9=9 - not allowed
RESET_IN.10=10 - Reset or (pre-reset + reset + clearing of track)
RESET_IN.11=11 - (reset + clearing of track) or pre-reset
RESET_IN.12=12 - (reset + clearing of track) or (pre-reset + clearing of track)
RESET_IN.13=13 - (reset + clearing of track) or (pre-reset + reset)

# Reset Out Mappings
RESET_OUT.0=0 - not allowed
RESET_OUT.1=1 - reset
RESET_OUT.2=2 - (reset + clearing of track)
RESET_OUT.3=3 - pre-reset
RESET_OUT.4=4 - (pre-reset + clearing of track)
RESET_OUT.5=5 - (pre-reset + reset)
RESET_OUT.6=6 - (pre-reset + reset + clearing of track)
RESET_OUT.7=7 - reset or pre-reset
RESET_OUT.8=8 - reset or (pre-reset + clearing of track)
RESET_OUT.9=9 - not allowed
RESET_OUT.10=10 - Reset or (pre-reset + reset + clearing of track)
RESET_OUT.11=11 - (reset + clearing of track) or pre-reset
RESET_OUT.12=12 - (reset + clearing of track) or (pre-reset + clearing of track)
RESET_OUT.13=13 - (reset + clearing of track) or (pre-reset + reset)

