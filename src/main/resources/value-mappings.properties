BEHAV_RESET.2=2 - Preparatory Direct Reset
BEHAV_RESET.3=3 - Preparatory Restricted Reset
BEHAV_RESET.4=4 - Auxiliary Reset
BEHAV_RESET.5=5 - Pre-Reset
BEHAV_RESET.6=6 - Reset
BEHAV_RESET.7=7 - Disabled

# Behavior Simul Mappings
