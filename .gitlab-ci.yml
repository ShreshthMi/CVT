variables:
  DEPENDENCY_TRACK_PROJECT_NAME: Config Validation Backend
  JDK_IMAGE: "registry.gitlab.frauscher.app:5005/it-services/docker/java:21-jdk"
  DOCKER_IMAGE_NAME: "configuration-validation-service"
  DOCKER_REGISTRY: "registry.gitlab.frauscher.app:5005"

include:
  - local: .gitlab/jobs/gradle-test.yml

container_build:
  stage: build
  image: docker:24-cli
  services:
    - docker:24-dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $DOCKER_REGISTRY
    - docker build -t ${DOCKER_REGISTRY}/${CI_PROJECT_PATH}/${DOCKER_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} .
    - docker build -t ${DOCKER_REGISTRY}/${CI_PROJECT_PATH}/${DOCKER_IMAGE_NAME}:latest .
    - docker push ${DOCKER_REGISTRY}/${CI_PROJECT_PATH}/${DOCKER_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}
    - docker push ${DOCKER_REGISTRY}/${CI_PROJECT_PATH}/${DOCKER_IMAGE_NAME}:latest